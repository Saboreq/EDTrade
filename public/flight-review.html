<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flight Deck viewport verification</title><style>body{margin:0;background:#1e252b;color:#e8edf0;font:14px sans-serif}header{height:42px;display:flex;align-items:center;gap:12px;padding:0 15px}button{padding:5px 12px;border:1px solid #6a7881;background:#101a20;color:#fff;cursor:pointer}iframe{display:block;border:0;background:#080e11;width:1536px;height:1150px}</style></head><body><header>Viewport verification <button data-width="1536" data-height="1100">Desktop 1536</button><button data-width="1363" data-height="1050">Laptop 1363</button><button data-width="768" data-height="1500">Tablet 768</button><button data-width="390" data-height="2400">Mobile 390</button><button data-width="360" data-height="2400">Mobile 360</button></header><iframe title="EDTrade viewport"></iframe><script>fetch('/').then(r=>r.text()).then(html=>{document.querySelector('iframe').srcdoc=html;});document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{const frame=document.querySelector('iframe');frame.style.width=button.dataset.width+'px';frame.style.height=button.dataset.height+'px';document.title='Flight Deck viewport '+button.dataset.width;}));</script></body></html>
